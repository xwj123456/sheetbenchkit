name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.7.6"
      - name: Install locked development dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Full core, CLI, installed wheel and bounded POSIX cleanup tests
        # Real OS gates: Windows keeps core/installed CLI active and checks run
        # refuses before adapter start; POSIX cases use short explicit timeouts.
        run: uv run pytest -q -ra
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src/sheetbenchkit
      - name: Build wheel and source distribution
        run: uv run python -m build
      - name: Record inner artifact SHA256
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          artifacts = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          assert len(artifacts) == 2, artifacts
          Path("dist/SHA256SUMS").write_text(
              "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in artifacts),
              encoding="utf-8",
          )
      - name: Save reviewed build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
